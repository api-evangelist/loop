aid: loop
name: Loop
description: >-
  Loop is a full-stack, AI-powered logistics data platform that unifies the
  fragmented operational and financial data of the physical economy. Founded by
  former Uber Freight leaders Matt McKinney and Shaosu Liu, Loop began in freight
  audit and payment and has expanded into an intelligence layer spanning freight
  audit, parcel and carrier-invoice auditing, real-time shipment visibility,
  parcel contract optimization, carrier payments, and autonomous exception
  management (DUX and the Exception Agent). The Loop developer platform exposes a
  REST API (api.loop.com/v1) for ingesting artifacts (invoices, shipment records,
  purchase orders), resolving business exceptions, managing organizations and
  factoring/invoicing relationships, and reading payable/receivable invoices and
  payments, plus a separate Onboarding API and Svix-based webhooks. Loop has raised
  $210M total, including a $95M Series C, from Valor Equity Partners, 8VC, Founders
  Fund, Index Ventures, J.P. Morgan Growth Equity, and others.
