    CreatePayableInvoiceRecordArtifactInput:
      type: object
      properties:
        invoiceNumber:
          type: string
          description: The invoice number. This will be used to match against existing invoices in Loop. Invoice number must be unique per payee organization and vendor organization pair.
          example: I123412
        issueDate:
          type: string
          description: The invoice issue date in YYYY-MM-DD format.
          example: '2025-06-09'
        paymentDueDate:
          type: string
          description: The payment due date in YYYY-MM-DD format.
          example: '2025-06-09'
        invoicedTotal:
          example:
            amount: '3.50'
            currencyCode: USD
          description: The total invoiced amount.
          allOf:
          - $ref: '#/components/schemas/Money'
        payorOrganizationQid:
          type: string
          description: "The QID of the payor organization.\n      **Must be specified if payorOrganizationTag is not specified.**"
          example: qid::organization:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        payorOrganizationTag:
          example:
            tagType: externalPayorUuid
            tagValue: e00b356d-8db3-476d-86dc-2c1a6808ea2c
          description: "A tag used to identify the payor organization.\n      **Must be specified if payorOrganizationQid is not specified.**"
          allOf:
          - $ref: '#/components/schemas/RawEntityTag'
        payeeOrganizationQid:
          type: string
          description: "The QID of the payee organization.\n      **Must be specified if payeeOrganizationTag is not specified.**"
          example: qid::organization:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        payeeOrganizationTag:
          example:
            tagType: externalPayeeUuid
            tagValue: e00b356d-8db3-476d-86dc-2c1a6808ea2c
          description: "A tag used to identify the payee organization.\n      **Must be specified if payeeOrganizationQid is not specified.**"
          allOf:
          - $ref: '#/components/schemas/RawEntityTag'
        vendorOrganizationQid:
          type: string
          description: "The QID of the vendor organization.\n      **Must be specified if vendorOrganizationTag is not specified.**"
          example: qid::organization:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        vendorOrganizationTag:
          example:
            tagType: externalVendorUuid
            tagValue: e00b356d-8db3-476d-86dc-2c1a6808ea2c
          description: "A tag used to identify the vendor organization.\n      **Must be specified if vendorOrganizationQid is not specified.**"
          allOf:
          - $ref: '#/components/schemas/RawEntityTag'
        lineItems:
          description: The payable line items invoiced.
          type: array
          items:
            $ref: '#/components/schemas/CreatePayableInvoiceLineItemInput'
        referenceNumbersList:
          description: Reference numbers to persist on the payable invoice in addition to the implicit INVOICE_NUMBER entry sourced from invoiceNumber. These are used by the payable-invoice ↔ shipment-job linking rules to match the invoice to a shipment job on keys such as BOL, PRO, PO, container, or sales order.
          example:
          - key: BOL_NUMBER
            value: '234287'
          - key: PO_NUMBER
            value: '123456789'
          type: array
          items:
            $ref: '#/components/schemas/RawPayableInvoiceReferenceNumberInput'
        entityTags:
          type: object
          additionalProperties:
            type: string
          properties: {}
          nullable: true
          example:
            tag1: value1
            tag2: value2
          description: Entity tags to be assigned to the payable invoice artifact.
      required:
      - invoiceNumber
      - issueDate
      - paymentDueDate
      - invoicedTotal
      - lineItems
