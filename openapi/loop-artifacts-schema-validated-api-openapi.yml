components:
  schemas:
    CreateShipmentRecordArtifactInput:
      type: object
      properties:
        source:
          type: string
          description: The source of the shipment data.
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/CreateShipmentRecordJobInput'
        artifactTags:
          type: object
          description: Entity tags assigned to the artifact
      required:
      - jobs
    ShipmentRecordArtifactJobFtlInfo:
      type: object
      properties:
        freightChargeTerms:
          allOf:
          - $ref: '#/components/schemas/FreightChargeTerms'
        carrierOrganizationQid:
          type: string
          description: Qualified unique identifier.
          example: qid::organization:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
          nullable: true
        carrierOrganizationTag:
          example:
            tagType: externalCarrierUuid
            tagValue: 304fb3dd-1f4a-404b-9f9e-c9134584915b
          description: A tag used to identify the carrier organization. Must be specified if carrierOrganizationQid is not specified.
          nullable: true
          type: object
          allOf:
          - $ref: '#/components/schemas/RawEntityTag'
        stops:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentRecordArtifactJobFtlStop'
      required:
      - freightChargeTerms
      - stops
    Weight:
      type: object
      properties:
        amount:
          type: string
          format: decimal-string
          example: '1.5'
        unit:
          type: string
          enum:
          - KILOGRAM
          - OUNCE
          - POUND
          - SHORT_TON
          example: POUND
      required:
      - amount
      - unit
    CreatePayableInvoiceLineItemInput:
      type: object
      properties:
        description:
          type: string
          description: The description of the line item.
        amount:
          example:
            amount: '3.50'
            currencyCode: USD
          description: The amount charged for this line item.
          allOf:
          - $ref: '#/components/schemas/Money'
        category:
          type: string
          description: The category of the line item.
          enum:
          - LINEHAUL
          - FUEL_SURCHARGE
          - DISCOUNT
          - OTHER
      required:
      - description
      - amount
      - category
    RawSparseAddressValue:
      type: object
      properties:
        addressLine1:
          type: string
          example: 123 Main Street
        addressLine2:
          type: string
          example: Suite 456
        city:
          type: string
          example: Chicago
        state:
          type: string
          description: Any variation of state. For example, "IL" or "Illinois" or something else.
          example: IL
        postalCode:
          type: string
          example: '60601'
        country:
          type: string
          description: Any variation of a country name or country ISO 2 code. For example, it could be empty, "US", "USA", "United States", "United States of America", "America", etc.
          example: USA
    ArtifactExpanded:
      type: object
      properties:
        qid:
          type: string
          description: Qualified unique identifier.
          example: qid::artifact:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        artifactType:
          type: string
          description: Domain-specific type of the artifact.
          enum:
          - ACCOUNT_STATEMENT
          - BILL_OF_LADING
          - CUSTOMER_RATE_CONFIRMATION
          - DELIVERY_ORDER
          - DELIVERY_RECEIPT
          - EXTERNAL_SHIPMENT_NOTE
          - INVOICE
          - IN_OUT_GATE
          - LUMPER_RECEIPT
          - OTHER
          - PACKET
          - PACKING_LIST
          - RATE_CONFIRMATION
          - SCALE_TICKET
          - SHIPMENT_RECORD
          - UNKNOWN
          - WASHOUT_RECEIPT
          - WEIGHT_INSPECTION
          - WORK_ORDER
          example: INVOICE
      required:
      - qid
      - artifactType
    ShipmentRecordArtifactJobGenericV1Location:
      type: object
      properties:
        address:
          nullable: true
          description: The stop address.
          example:
            addressLine1: 123 Main St
            addressLine2: Suite 100
            city: San Diego
            state: CA
            postalCode: '92101'
            country: US
          type: object
          allOf:
          - $ref: '#/components/schemas/RawSparseAddressValue'
