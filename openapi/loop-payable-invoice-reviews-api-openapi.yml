    ShipmentJobOceanInfo:
      type: object
      properties:
        carrierOrganizationName:
          type:
          - string
          - 'null'
          description: The name of the carrier
        carrierOrganizationQid:
          type:
          - string
          - 'null'
          description: Qualified unique identifier.
          example: qid::organization:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        carrierOrganization:
          description: The carrier associated with this job. This is an expansion field. To include this field, you must include `organization` in the query parameters.
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/OrganizationExpanded'
        forwarderOrganizationName:
          type:
          - object
          - 'null'
          description: The name of the forwarder
        forwarderOrganizationQid:
          type:
          - string
          - 'null'
          description: Qualified unique identifier.
          example: qid::organization:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        forwarderOrganization:
          description: The forwarder associated with this job. This is an expansion field. To include this field, you must include `organization` in the query parameters.
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/OrganizationExpanded'
        consolidationType:
          type:
          - string
          - 'null'
          description: The consolidation type for this ocean shipment
          enum:
          - FCL
          - LCL
        addresses:
          description: The addresses associated with this ocean shipment
          type: array
          items:
            $ref: '#/components/schemas/ShipmentJobOceanAddress'
        routeLocations:
          description: The route locations for this ocean shipment
          type: array
          items:
            $ref: '#/components/schemas/ShipmentJobOceanRouteLocation'
        containers:
          description: The containers used for this ocean shipment
          type: array
          items:
            $ref: '#/components/schemas/ShipmentJobOceanContainer'
        totalVolume:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Volume'
        grossWeight:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Weight'
        freightChargeTerms:
          type: string
          description: The freight charge terms for this ocean shipment
          enum:
          - COLLECT
          - PREPAID
          - THIRD_PARTY
          - UNKNOWN
          example: PREPAID
        dates:
          description: Dates associated with this ocean shipment (e.g. cargo received, laden on board, arrival).
          type: array
          items:
            $ref: '#/components/schemas/ShipmentJobOceanDate'
      required:
      - carrierOrganizationName
      - carrierOrganizationQid
      - carrierOrganization
      - forwarderOrganizationName
      - forwarderOrganizationQid
      - forwarderOrganization
      - consolidationType
      - addresses
      - routeLocations
      - containers
      - totalVolume
      - grossWeight
      - freightChargeTerms
      - dates
    Address:
      type: object
      properties:
        qid:
          type: string
          description: Qualified unique identifier.
          example: qid::address:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        addressLine1:
          type: string
          example: 123 Main Street
        addressLine2:
          type: string
          example: Suite 456
        city:
          type: string
          example: Chicago
        state:
          type: string
          example: IL
        postalCode:
          type: string
          example: '60601'
        country:
          type: string
          example: US
          description: ISO 3166-1 alpha-2 country code.
      required:
      - qid
      - addressLine1
      - city
      - postalCode
      - country
    ShipmentJobAirRouteUnlocodeLocation:
      type: object
      properties:
        qid:
          type:
          - string
          - 'null'
          description: Qualified unique identifier.
          example: qid::shipment_job_air_route_location:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        type:
          type: string
          description: The type of route location
          enum:
          - ORIGIN_AIRPORT
          - DESTINATION_AIRPORT
          - INTERMEDIATE_AIRPORT
          - CONTAINER_FREIGHT_STATION
          example: CONTAINER_FREIGHT_STATION
        unlocode:
          type: string
          description: The UN/LOCODE for this location
          example: USNYC
      required:
      - qid
      - type
      - unlocode
    ShipmentJobLtlInfo:
      type: object
      properties:
        billToAddressName:
          type:
          - object
          - 'null'
          description: The name associated with the bill to address on the job artifact
        billToAddressQid:
          type:
          - string
          - 'null'
          description: Qualified unique identifier.
          example: qid::address:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        billToAddress:
          description: The bill to address on the job artifact This is an expansion field. To include this field, you must include `address` in the query parameters.
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Address'
        carrierOrganizationName:
          type:
          - string
          - 'null'
          description: The name of the carrier
        carrierOrganizationQid:
          type:
          - string
          - 'null'
          description: Qualified unique identifier.
          example: qid::organization:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        carrierOrganization:
          description: The carrier associated with this job. This is an expansion field. To include this field, you must include `organization` in the query parameters.
          allOf:
          - $ref: '#/components/schemas/OrganizationExpanded'
        brokerOrganizationQid:
          type:
          - string
          - 'null'
          description: Qualified unique identifier.
          example: qid::organization:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        brokerOrganization:
          description: The broker associated with this job. This is an expansion field. To include this field, you must include `organization` in the query parameters.
          allOf:
          - $ref: '#/components/schemas/OrganizationExpanded'
        freightChargeTerms:
          allOf:
          - $ref: '#/components/schemas/FreightChargeTerms'
        originAddressName:
          type:
          - object
          - 'null'
          description: The name associated with the origin address
        originAddressQid:
          type:
          - string
          - 'null'
          description: Qualified unique identifier.
          example: qid::address:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        originAddress:
          description: The origin address of the shipment. This is an expansion field. To include this field, you must include `address` in the query parameters.
          allOf:
          - $ref: '#/components/schemas/Address'
        pickupDate:
          type:
          - string
          - 'null'
          format: floating-date
          example: '2023-01-01'
        destinationAddressName:
          type:
          - object
          - 'null'
          description: The name associated with the destination address
        destinationAddressQid:
          type:
          - string
          - 'null'
          description: Qualified unique identifier.
          example: qid::address:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        destinationAddress:
          description: The destination address of the shipment. This is an expansion field. To include this field, you must include `address` in the query parameters.
          allOf:
          - $ref: '#/components/schemas/Address'
        deliveryDate:
          type:
          - string
          - 'null'
          format: floating-date
          example: '2023-01-01'
        articlesSummary:
          $ref: '#/components/schemas/ShipmentJobArticlesSummary'
        articles:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentJobLtlInfoArticle'
      required:
      - billToAddressName
      - billToAddressQid
      - carrierOrganizationName
      - carrierOrganizationQid
      - brokerOrganizationQid
      - freightChargeTerms
      - originAddressName
      - originAddressQid
      - pickupDate
      - destinationAddressName
      - destinationAddressQid
      - deliveryDate
      - articlesSummary
      - articles
    ShipmentJobLtlInfoArticle:
      type: object
      properties:
        description:
          type:
          - object
          - 'null'
        dimensions:
          example:
            height: '2.8'
            length: '12.1'
            width: '1.5'
            unit: INCH
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Dimensions'
        grossWeight:
          example:
            amount: '20.2'
            unit: POUND
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/Weight'
        nmfcClass:
          allOf:
          - $ref: '#/components/schemas/NmfcClass'
        nmfcCode:
          type:
          - string
          - 'null'
          description: The NMFC code string associated with this article.
          example: '87700'
        packageCount:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/PackageCount'
        handlingUnit:
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/HandlingUnit'
      required:
      - description
      - dimensions
      - grossWeight
      - nmfcClass
      - nmfcCode
      - packageCount
      - handlingUnit
    PayableInvoiceAdjustmentReview:
      type: object
      properties:
        approved:
          example:
            amount: '3.50'
            currencyCode: USD
          allOf:
          - $ref: '#/components/schemas/Money'
        appliedAmount:
          example:
            amount: '3.50'
            currencyCode: USD
          description: The adjustment amount that is applied to the payable invoice.
          allOf:
          - $ref: '#/components/schemas/Money'
        adjustmentQid:
          type: string
          description: Qualified unique identifier.
          example: qid::payable_invoice_adjustment:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        description:
          type: string
          description: The description of the adjustment.
          example: QUICK_PAY_DISCOUNT
        externalIdentifier:
          type:
          - object
          - 'null'
          description: The external identifier of the adjustment if provided.
      required:
      - approved
      - appliedAmount
      - adjustmentQid
      - description
      - externalIdentifier
    ShipmentJobIntermodalInfo:
      type: object
      properties:
        carrierOrganizationName:
          type:
          - string
          - 'null'
          description: The name of the carrier
        carrierOrganizationQid:
          type:
          - string
          - 'null'
          description: Qualified unique identifier.
          example: qid::organization:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        carrierOrganization:
          description: The carrier associated with this job. This is an expansion field. To include this field, you must include `organization` in the query parameters.
          allOf:
          - $ref: '#/components/schemas/OrganizationExpanded'
      required:
      - carrierOrganizationName
      - carrierOrganizationQid
    PayableInvoiceReview:
      type: object
      properties:
        exceptions:
          description: A list of exceptions related to the payable invoice. This is an expansion field. To include this field, you must include `exceptions` in the query parameters.
          type: array
          items:
            $ref: '#/components/schemas/BusinessException'
        payableInvoiceQid:
          type: string
          description: Qualified unique identifier.
          example: qid::payable_invoice:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        payableInvoice:
          description: The payable invoice. This is an expansion field. To include this field, you must include `payableInvoice` in the query parameters.
          allOf:
          - $ref: '#/components/schemas/PayableInvoiceExpanded'
        payableAllocationReviews:
          deprecated: true
          description: The allocation information for this review. Includes general ledger information. This is an expansion field. To include this field, you must include `payableAllocationReviews` in the query parameters.
          type: array
          items:
            $ref: '#/components/schemas/PayableAllocationReviewExpand'
        payableAllocations:
          description: The allocations for this payable invoice. This is an expansion field. To include this field, you must include `payableAllocations` in the query parameters.
          type: array
          items:
            $ref: '#/components/schemas/PayableAllocationExpand'
        status:
          type: string
          enum:
          - INCOMPLETE
          - COMPLETE
          - ON_HOLD
          - NOT_ENABLED
          example: COMPLETE
        auditStatus:
          type: string
          enum:
          - IN_PROGRESS
          - PUBLISHED
          - IGNORED
          - SKIPPED
          - NOT_APPLICABLE
          example: PUBLISHED
        outcome:
          type:
          - string
          - 'null'
          enum:
          - FULLY_APPROVED
          - PARTIALLY_APPROVED
          - REJECTED
          example: FULLY_APPROVED
        approved:
          example:
            amount: '3.50'
            currencyCode: USD
          allOf:
          - $ref: '#/components/schemas/Money'
        lastApprovedAt:
          type:
          - string
          - 'null'
          format: utc-timestamp
          example: '2023-01-01T00:00:00.000Z'
        lastApprovedBy:
          description: The last user to approve the payable invoice. This is an expansion field. To include this field, you must include `lastApprovedBy` in the query parameters.
          type:
          - object
          - 'null'
          allOf:
          - $ref: '#/components/schemas/User'
        expected:
          example:
            amount: '3.50'
            currencyCode: USD
          allOf:
          - $ref: '#/components/schemas/Money'
        lineItemGroupReviews:
          type: array
          items:
            $ref: '#/components/schemas/PayableInvoiceLineItemGroupReview'
        adjustmentReviews:
          type: array
          items:
            $ref: '#/components/schemas/PayableInvoiceAdjustmentReview'
        expandRevisionCreatedAt:
          type: string
          format: utc-timestamp
          example: '2023-01-01T00:00:00.000Z'
          description: The most recent timestamp at which the payable invoice review or its related entities were revised.
      required:
      - payableInvoiceQid
      - status
      - auditStatus
      - outcome
      - approved
      - lastApprovedAt
      - expected
      - lineItemGroupReviews
      - adjustmentReviews
      - expandRevisionCreatedAt
    ShipmentJobExpanded:
      type: object
      properties:
        qid:
          type: string
          description: Qualified unique identifier.
          example: qid::shipment_job:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        createdAt:
          type: string
          format: utc-timestamp
          example: '2023-01-01T00:00:00.000Z'
        jobType:
          type: string
          enum:
          - AIR
          - CARTAGE
          - COURIER
          - CUSTOMS
          - DRAYAGE
          - FTL
          - GENERIC_V1
          - INTERMODAL
          - LTL
          - OCEAN
          - ORIGIN_HANDLING
          - RAIL
          - SEA_AIR
          - TONU
          - TO_BE_DETERMINED
          - UNKNOWN
          - WAREHOUSING
        primaryVendorOrganizationQid:
          type:
          - string
          - 'null'
          description: Qualified unique identifier.
          example: qid::organization:0ca6f700-4137-4d09-b44a-43bb8d7900c4
          format: qid
        primaryVendorOrganization:
          description: The primary vendor organization for this job — the contracted party the client treats as the bill-from. Resolves to the carrier for FTL/LTL/etc., the forwarder for OCEAN/AIR/SEA_AIR (or carrier when forwarder is only a booking agent), and the vendor for CUSTOMS/WAREHOUSING/UNKNOWN/GENERIC_V1/ORIGIN_HANDLING. Null for TO_BE_DETERMINED, RAIL, and unrouted ORIGIN_HANDLING. This is an expansion field. To include this field, you must include `organization` in the query parameters.
          allOf:
          - $ref: '#/components/schemas/OrganizationExpanded'
        jobTypeInfo:
          description: The job type info, if applicable.
          oneOf:
          - $ref: '#/components/schemas/ShipmentJobAirInfo'
          - $ref: '#/components/schemas/ShipmentJobFtlInfo'
          - $ref: '#/components/schemas/ShipmentJobGenericV1Info'
          - $ref: '#/components/schemas/ShipmentJobIntermodalInfo'
          - $ref: '#/components/schemas/ShipmentJobLtlInfo'
          - $ref: '#/components/schemas/ShipmentJobOceanInfo'
          - $ref: '#/components/schemas/ShipmentJobSeaAirInfo'
          - $ref: '#/components/schemas/ShipmentJobTonuInfo'
          - $ref: '#/components/schemas/ShipmentJobUnknownInfo'
          example:
            freightChargeTerms: PREPAID
            carrierOrganizationName: Example Carrier Inc
            carrierOrganizationQid: null
            brokerOrganizationQid: null
            billToAddressName: Billing Department
            billToAddressQid: null
            firstOriginAddressName: Warehouse A
            firstOriginAddressQid: null
            lastDestinationAddressName: Distribution Center B
            lastDestinationAddressQid: null
            stops:
            - addressName: Warehouse A
              addressQid: null
              date: null
              organizationQid: null
