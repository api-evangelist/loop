openapi: 3.2.0
info:
  title: Loop Payable Invoice Reviews API
  description: The HTTP REST API for Loop.
  version: '0.1'
  contact: {}
servers:
- url: https://api.loop.com
  description: Production
security:
- bearer: []
tags:
- name: payable-invoice-reviews
paths:
  /v1/payable-invoice-reviews:
    get:
      description: Returns a list of payable invoice reviews
      operationId: PayableInvoiceReview_list
      parameters:
      - name: expand
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - exceptions
            - expandRevisionCreatedAt
            - lastApprovedBy
            - lineItemGroupReviews.lineItemGroup
            - lineItemGroupReviews.rateEngineRateItem
            - lineItemGroupReviews.rateEngineRateItem.tags
            - lineItemGroupReviews.rateEngineRateItems
            - lineItemGroupReviews.rateEngineRateItems.tags
            - payableAllocations
            - payableAllocationReviews
            - payableInvoice
            - payableInvoice.exceptions
            - payableInvoice.artifacts
            - payableInvoice.organizations
            - payableInvoice.organizations.tags
            - payableInvoice.shipmentJobs
            - payableInvoice.shipmentJobs.addresses
            - payableInvoice.shipmentJobs.artifacts
            - payableInvoice.shipmentJobs.jobTypeInfo.address
            - payableInvoice.shipmentJobs.jobTypeInfo.organizations
            - payableInvoice.shipmentJobs.jobTypeInfo.organizations.tags
            - payableInvoice.shipmentJobs.organizations
            - payableInvoice.shipmentJobs.organizations.tags
            - payableInvoice.shipmentJobs.tags
            - payableInvoice.shipmentJobs.shipment
            - payableInvoice.shipmentJobs.shipment.exceptions
            - payableInvoice.tags
      - name: expandRevisedBefore
        required: false
        in: query
        description: Filter to only results that have been revised (including any possible field expansion) before this timestamp. This can be a UTC timestamp or a floating date. If a floating date is passed, the timestamp used will be the beginning (midnight UTC) of the date.
        schema:
          format: utc-timestamp
          example: '2020-01-01T00:00:00.000Z'
          type: string
      - name: expandRevisedAfter
        required: false
        in: query
        description: Filter to only results that have been revised (including any possible field expansion) after this timestamp. This can be a UTC timestamp or a floating date. If a floating date is passed, the timestamp used will be the beginning (midnight UTC) of the date.
        schema:
          format: utc-timestamp
          example: '2020-01-01T00:00:00.000Z'
          type: string
      - name: first
        required: false
        in: query
        description: The number of results to return. Default value is 10. Any custom value specified must lie between 0 and 100, inclusive.
        schema:
          type: number
      - name: after
        required: false
        in: query
        description: The cursor to start returning results from
        schema:
          type: string
      responses:
        '200':
          description: The paginated response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayableInvoiceReview'
                  pageInfo:
                    type: object
                    properties:
                      hasPreviousPage:
                        type: boolean
                      hasNextPage:
                        type: boolean
                      startCursor:
                        type: string
                      endCursor:
                        type: string
      summary: List payable invoice reviews
      tags:
      - payable-invoice-reviews
  /v1/payable-invoices/{qid}/review:
    get:
      description: Returns the payable invoice review for the specified payable invoice QID
      operationId: PayableInvoiceReview_get
      parameters:
      - name: expand
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - exceptions
            - expandRevisionCreatedAt
            - lastApprovedBy
            - lineItemGroupReviews.lineItemGroup
            - lineItemGroupReviews.rateEngineRateItem
            - lineItemGroupReviews.rateEngineRateItem.tags
            - lineItemGroupReviews.rateEngineRateItems
            - lineItemGroupReviews.rateEngineRateItems.tags
            - payableAllocations
            - payableAllocationReviews
            - payableInvoice
            - payableInvoice.exceptions
            - payableInvoice.artifacts
            - payableInvoice.organizations
            - payableInvoice.organizations.tags
            - payableInvoice.shipmentJobs
            - payableInvoice.shipmentJobs.addresses
            - payableInvoice.shipmentJobs.artifacts
            - payableInvoice.shipmentJobs.jobTypeInfo.address
            - payableInvoice.shipmentJobs.jobTypeInfo.organizations
            - payableInvoice.shipmentJobs.jobTypeInfo.organizations.tags
            - payableInvoice.shipmentJobs.organizations
            - payableInvoice.shipmentJobs.organizations.tags
            - payableInvoice.shipmentJobs.tags
            - payableInvoice.shipmentJobs.shipment
            - payableInvoice.shipmentJobs.shipment.exceptions
            - payableInvoice.tags
      - name: qid
        required: true
        in: path
        description: QID of the entity to retrieve
        schema:
          format: qid
          example: qid::payable_invoice:0ca6f700-4137-4d09-b44a-43bb8d7900c5
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayableInvoiceReview'
        '400':
          description: Invalid QID
      summary: Retrieve a payable invoice review
      tags:
      - payable-invoice-reviews
