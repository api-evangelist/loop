openapi: 3.0.0
info:
  title: Loop Onboarding artifacts ping API
  description: HTTP REST API for Loop Payments Onboarding.
  version: '1.0'
  contact: {}
servers:
- url: https://onboarding.api.loop.com
security:
- bearerAuth: []
tags:
- name: ping
paths:
  /v1/ping:
    get:
      operationId: Ping_ping
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'
      summary: Send a ping
      tags:
      - ping
components:
  schemas:
    Pong:
      type: object
      properties:
        pong:
          type: number
          default: 1
      required:
      - pong
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: apiKey
      name: bearerAuth
      type: http
      description: "Bearer HTTP authentication. Allowed headers: \n  Authorization: Bearer <apiKey>"
