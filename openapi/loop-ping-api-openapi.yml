openapi: 3.2.0
info:
  title: Loop Ping API
  description: The HTTP REST API for Loop.
  version: '0.1'
  contact: {}
servers:
- url: https://api.loop.com
  description: Production
security:
- bearer: []
tags:
- name: Ping
paths:
  /v1/ping:
    get:
      operationId: Ping_ping
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'
      summary: Send a ping
      tags:
      - Ping
components:
  schemas:
    Pong:
      type: object
      properties:
        pong:
          type: number
          default: 1
      required:
      - pong
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: apiKey
      name: bearerAuth
      type: http
      description: "Bearer HTTP authentication. Allowed headers: \n  Authorization: Bearer <apiKey>"
