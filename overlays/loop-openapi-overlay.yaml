overlay: 1.0.0
info:
  title: API Evangelist enhancements for Loop API
  version: 1.0.0
extends: openapi/loop-openapi-original.json
actions:
  - target: $.info
    update:
      x-apievangelist-provider: loop
      x-apievangelist-domain: logistics-freight-audit-payments
      x-apievangelist-identifier-scheme: QID (qid::<entity-type>:<uuid>[@revision])
      x-apievangelist-conventions: conventions/loop-conventions.yml
      x-apievangelist-errors: errors/loop-problem-types.yml
      x-apievangelist-data-model: data-model/loop-data-model.yml
      x-apievangelist-webhooks: asyncapi/loop-webhooks.yml
  - target: $.info
    update:
      x-agentic-access: agentic-access/loop-agentic-access.yml
  - target: $.components.securitySchemes.bearer
    update:
      x-apievangelist-note: >-
        Bearer HTTP auth with an API key (lk_live_ prefix) issued by a Loop
        contact; validate with GET /v1/ping. See
        authentication/loop-authentication.yml.
